context:
  version: "5.8.0"

package:
  name: certbot-dns-google
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/certbot-dns-google/certbot_dns_google-${{ version }}.tar.gz
  sha256: fcff7da84fc86598f83e269609845737631a46a25ce6414a780c708766c400ca

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - acme >=${{ version }}
    - certbot >=${{ version }}
    - google-api-python-client >=1.6.5
    - google-auth >=2.16.0

tests:
  - python:
      imports:
        - certbot_dns_google
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://certbot.eff.org
  summary: Google Cloud DNS Authenticator plugin for Certbot
  license: Apache-2.0
  license_file: LICENSE.txt
  documentation: https://certbot.eff.org
  repository: https://github.com/certbot/certbot

extra:
  recipe-maintainers:
    - pavelzw
